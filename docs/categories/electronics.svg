<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 264" width="344" height="264" role="img" aria-label="Electronics">
  <rect width="344" height="264" rx="16" fill="#f2efe7"/>
  <!-- earbuds -->
  <g fill="#e08b5e">
    <ellipse cx="72" cy="110" rx="19" ry="18"/>
    <path d="M60 122 H84 L78 158 H67 Z"/>
    <ellipse cx="112" cy="102" rx="19" ry="18"/>
    <path d="M100 114 H124 L119 150 H108 Z"/>
  </g>
  <!-- earbud case, drawn last so the stems sit inside it -->
  <rect x="45" y="142" width="84" height="50" rx="12" fill="#e08b5e"/>
  <path d="M87 156 L100 180 H74 Z" fill="#f2efe7"/>
  <!-- power bank -->
  <rect x="140" y="48" width="58" height="146" rx="15" fill="#e08b5e"/>
  <g fill="#f2efe7">
    <rect x="151" y="62" width="8" height="15" rx="4"/>
    <rect x="165" y="62" width="8" height="15" rx="4"/>
    <rect x="179" y="62" width="8" height="15" rx="4"/>
  </g>
  <text x="169" y="180" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#f2efe7">mi</text>
  <!-- smartwatch -->
  <rect x="234" y="54" width="42" height="42" rx="10" fill="#e08b5e"/>
  <rect x="234" y="156" width="42" height="42" rx="10" fill="#e08b5e"/>
  <rect x="288" y="112" width="7" height="18" rx="3.5" fill="#e08b5e"/>
  <rect x="220" y="84" width="70" height="84" rx="20" fill="#f2efe7" stroke="#e08b5e" stroke-width="5"/>
  <g fill="none" stroke="#e08b5e" stroke-width="4.5" stroke-linecap="round">
    <path d="M255 126 V104"/>
    <path d="M255 126 L270 134"/>
  </g>
  <text x="172" y="236" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="2.4" fill="#6f6f6f">ELECTRONICS</text>
</svg>
